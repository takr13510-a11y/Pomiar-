<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MetrBudowa AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Barlow:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --charcoal:#1B1A17; --charcoal-2:#232019; --charcoal-3:#2C2823;
    --concrete:#A9A29A; --chalk:#F5F1E8;
    --orange:#E85D2F; --blueprint:#4C6FA5; --blueprint-dim:#2F4B7C;
    --ok:#6BA368; --warn:#D9A441;
    --line: rgba(245,241,232,0.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0; background:var(--charcoal); color:var(--chalk); font-family:'Barlow',sans-serif; overflow:hidden; position:fixed; inset:0;}
  .app{height:100%; display:flex; flex-direction:column;}

  header{display:flex; align-items:baseline; justify-content:space-between; padding:13px 18px 9px; border-bottom:1px solid var(--line); flex-shrink:0; z-index:20;}
  .mark{font-family:'Archivo Black'; font-size:18px; letter-spacing:-0.02em;}
  .mark span{color:var(--orange);}
  .tag{font-size:9.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--concrete);}

  .views{flex:1; min-height:0; position:relative;}
  .view{position:absolute; inset:0; display:none; flex-direction:column; overflow:hidden;}
  .view.active{display:flex;}
  .scroll{overflow-y:auto; -webkit-overflow-scrolling:touch; flex:1;}
  .section-pad{padding:16px 18px 40px;}

  nav.tabs{display:flex; border-top:1px solid var(--line); background:var(--charcoal); flex-shrink:0; z-index:20; padding-bottom:env(safe-area-inset-bottom);}
  nav.tabs button{flex:1; background:none; border:none; color:var(--concrete); font-family:'Barlow'; font-weight:600; font-size:9px; letter-spacing:.02em; text-transform:uppercase; padding:10px 1px 8px; display:flex; flex-direction:column; align-items:center; gap:4px;}
  nav.tabs button svg{width:18px; height:18px; stroke:var(--concrete); fill:none; stroke-width:1.8;}
  nav.tabs button.active{color:var(--orange);} nav.tabs button.active svg{stroke:var(--orange);}

  h1.page-title{font-family:'Archivo Black'; font-size:19px; margin:2px 0 3px;}
  p.page-sub{color:var(--concrete); font-size:12.5px; margin:0 0 16px; line-height:1.5;}

  .card{background:var(--charcoal-2); border:1px solid var(--line); border-radius:5px; padding:14px 15px; margin-bottom:11px;}
  .card-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .card-head .name{font-weight:700; font-size:14px; line-height:1.3;}
  .card-head .eyebrow{font-family:'Space Mono'; font-size:9.5px; color:var(--blueprint); letter-spacing:.05em; flex-shrink:0; margin-left:8px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .result-line{display:flex; justify-content:space-between; align-items:baseline; border-top:1px dashed var(--line); margin-top:12px; padding-top:9px;}
  .result-line .num{font-family:'Space Mono'; font-size:19px; font-weight:700; color:var(--orange);}
  .result-line .lbl{font-size:12px; color:var(--concrete);}

  optgroup{background:var(--charcoal); color:var(--concrete); font-size:11px; text-transform:uppercase; letter-spacing:.08em; font-style:normal;}
  optgroup option{color:var(--chalk); text-transform:none; letter-spacing:0; font-size:14px;}
  select, input[type=number], input[type=text], textarea{font-family:'Barlow'; background:var(--charcoal-2); color:var(--chalk); border:1px solid var(--line); border-radius:3px; padding:10px 11px; font-size:14px; width:100%; resize:vertical;}
  label.field-label{font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--concrete); display:block; margin:0 0 5px;}
  .field{margin-bottom:13px;}

  .btn{font-family:'Barlow'; font-weight:700; font-size:13.5px; border:none; border-radius:3px; padding:12px 18px; cursor:pointer;}
  .btn-primary{background:var(--orange); color:#1B1A17;}
  .btn-ghost{background:transparent; color:var(--chalk); border:1px solid var(--line);}
  .btn-blue{background:var(--blueprint-dim); color:var(--chalk);}
  .btn-danger{background:transparent; color:var(--warn); border:1px solid var(--warn);}
  .btn:disabled{opacity:.4;}
  .btn-full{width:100%;}

  /* instrukcja startowa */
  .how-step{display:flex; gap:12px; align-items:flex-start; padding:14px 0; border-bottom:1px solid var(--line);}
  .how-num{width:22px;height:22px;border-radius:50%;background:var(--orange);color:#1B1A17;font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px;}
  .how-art{width:56px;flex-shrink:0;}
  .how-art svg{width:100%;height:auto;display:block;}
  .how-txt{flex:1;min-width:0;}
  .how-t{font-weight:700;font-size:13.5px;line-height:1.35;}
  .how-d{font-size:12.5px;color:var(--concrete);line-height:1.5;margin-top:4px;}

  /* celownik */
  .crosshair{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;z-index:4;pointer-events:none;transition:transform .12s;}
  .crosshair svg{width:100%;height:100%;filter:drop-shadow(0 0 3px rgba(0,0,0,.7));}
  .crosshair.pulse{transform:scale(1.25);}
  .crosshair.hidden{display:none;}

  /* pasek krokow */
  .step-bar{position:absolute;left:0;right:0;top:56px;z-index:5;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 16px;}
  .sb-item{display:flex;align-items:center;gap:6px;background:rgba(27,26,23,.85);backdrop-filter:blur(4px);border:1px solid var(--line);border-radius:20px;padding:5px 11px 5px 6px;}
  .sb-dot{width:19px;height:19px;border-radius:50%;background:var(--charcoal-3);color:var(--concrete);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;}
  .sb-lbl{font-size:11px;font-weight:600;color:var(--concrete);text-transform:uppercase;letter-spacing:.05em;}
  .sb-item.active .sb-dot{background:var(--orange);color:#1B1A17;}
  .sb-item.active .sb-lbl{color:var(--chalk);}
  .sb-item.done .sb-dot{background:var(--ok);color:#1B1A17;}
  .sb-line{width:14px;height:1px;background:var(--line);flex-shrink:0;}

  .cam-wrap{position:relative; flex:1; min-height:0; background:#000;}
  video{width:100%; height:100%; object-fit:cover; display:block;}
  canvas.overlay{position:absolute; inset:0; width:100%; height:100%; touch-action:none;}
  .hud-top{position:absolute; top:12px; left:12px; right:12px; z-index:5; display:flex; justify-content:space-between; gap:10px;}
  .pill{background:rgba(27,26,23,0.85); backdrop-filter:blur(4px); border:1px solid var(--line); border-radius:3px; padding:7px 10px; font-family:'Space Mono'; font-size:11px; line-height:1.5;}
  .pill b{color:var(--orange);}
  .pill.step{font-family:'Barlow'; font-weight:600; font-size:12px; max-width:62%;}
  .hud-bottom{position:absolute; left:0; right:0; bottom:0; z-index:6; background:linear-gradient(0deg, rgba(27,26,23,0.97) 60%, rgba(27,26,23,0)); padding:26px 14px 14px;}
  .readout{font-family:'Space Mono'; font-size:32px; font-weight:700; line-height:1;}
  .readout small{font-size:13px; color:var(--concrete); font-weight:400;}
  .sub-readout{font-family:'Space Mono'; font-size:11.5px; color:var(--concrete); margin-top:4px;}
  .action-row{display:flex; gap:7px; margin-top:12px;}
  .action-row .btn{flex:1; padding:11px 4px; font-size:11.5px;}
  .setup-panel{padding:18px 18px 22px;}
  .setup-panel h2{font-family:'Archivo Black'; font-size:16px; margin:0 0 4px;}
  .hint{color:var(--concrete); font-size:12.5px; line-height:1.55; margin:0 0 16px;}

  .chip-row{display:flex; flex-wrap:wrap; margin-bottom:12px;}
  .saved-chip{display:inline-flex; gap:6px; background:var(--charcoal-2); border:1px solid var(--blueprint-dim); font-family:'Space Mono'; font-size:11.5px; padding:6px 10px; border-radius:20px; margin:0 6px 7px 0; cursor:pointer;}
  .saved-chip.active{background:var(--blueprint-dim);}
  .empty-note{color:var(--concrete); font-size:12px; font-style:italic; padding:4px 0 12px;}

  .cat-scroll{display:flex; gap:7px; overflow-x:auto; padding:0 18px 12px; margin:0 -18px 4px;}
  .cat-scroll::-webkit-scrollbar{display:none;}
  .cat-btn{flex-shrink:0; background:var(--charcoal-2); border:1px solid var(--line); color:var(--concrete); font-size:12px; font-weight:600; padding:8px 13px; border-radius:20px; white-space:nowrap;}
  .cat-btn.active{background:var(--orange); color:#1B1A17; border-color:var(--orange);}

.demo-badge{display:inline-block;background:var(--warn);color:#1B1A17;font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:3px 8px;border-radius:2px;margin-left:6px;}
  .demo-note{border:1px dashed var(--warn);border-radius:4px;padding:11px 12px;font-size:12px;color:var(--warn);line-height:1.55;margin-top:14px;}
  .demo-strip{background:rgba(217,164,65,0.12);border-left:2px solid var(--warn);border-radius:0 3px 3px 0;padding:9px 12px;font-size:12px;color:var(--warn);line-height:1.5;margin-bottom:14px;}
  .ai-badge{display:inline-flex; gap:5px; background:var(--blueprint-dim); color:var(--chalk); font-size:9.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; padding:3px 8px; border-radius:2px;}
  .ai-out{background:var(--charcoal-2); border:1px solid var(--blueprint-dim); border-radius:5px; padding:14px 15px; margin-top:14px; font-size:13.5px; line-height:1.65;}
  .ai-out h3{font-family:'Archivo Black'; font-size:13px; margin:14px 0 6px; color:var(--orange);}
  .ai-out h3:first-child{margin-top:0;}
  .ai-out ul{margin:6px 0; padding-left:18px;} .ai-out li{margin-bottom:5px;}
  .ai-out table{width:100%; border-collapse:collapse; font-size:12px; margin:8px 0; table-layout:fixed;}
  .ai-out th{text-align:left; color:var(--concrete); font-size:10px; text-transform:uppercase; letter-spacing:.06em; border-bottom:1px solid var(--line); padding:5px 4px;}
  .ai-out td{padding:6px 4px; border-bottom:1px solid var(--line); vertical-align:top; word-break:break-word; hyphens:auto;}
  .ai-out td:last-child, .ai-out th:last-child{text-align:right; white-space:nowrap; width:24%;}
  .ai-out strong{color:var(--chalk);}
  .spinner{display:inline-block; width:14px; height:14px; border:2px solid var(--line); border-top-color:var(--orange); border-radius:50%; animation:spin .7s linear infinite; vertical-align:-2px; margin-right:7px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading-box{color:var(--concrete); font-size:13px; padding:16px 0;}
  .err-box{border:1px solid var(--warn); border-radius:4px; padding:12px; font-size:12.5px; color:var(--warn); margin-top:12px; line-height:1.5;}

  .notice{border:1px dashed var(--line); border-radius:5px; padding:12px 13px; font-size:12px; color:var(--concrete); line-height:1.6; margin-top:16px;}
  .notice b{color:var(--chalk);}
  .quick-add{display:flex; flex-wrap:wrap; gap:6px; margin-bottom:14px;}
  .quick-add button{background:var(--charcoal-3); border:1px solid var(--line); color:var(--concrete); font-size:11.5px; padding:6px 10px; border-radius:3px;}

  /* WYCENA — czytelny układ */
  .cost-total{background:linear-gradient(160deg,#2C2823,#232019); border:1px solid var(--orange); border-radius:6px; padding:16px; margin-bottom:14px;}
  .cost-total .ct-lbl{font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--concrete);}
  .cost-total .ct-val{font-family:'Space Mono'; font-size:27px; font-weight:700; color:var(--orange); line-height:1.15; margin:5px 0 2px; white-space:nowrap;}
  .cost-total .ct-per{font-family:'Space Mono'; font-size:12.5px; color:var(--chalk);}
  .cost-total .ct-split{display:flex; gap:10px; margin-top:13px; padding-top:12px; border-top:1px solid var(--line);}
  .cost-total .ct-split div{flex:1;}
  .cost-total .ct-split .s-lbl{font-size:10px; text-transform:uppercase; letter-spacing:.07em; color:var(--concrete);}
  .cost-total .ct-split .s-val{font-family:'Space Mono'; font-size:15px; font-weight:700; margin-top:3px; white-space:nowrap;}

  .cost-sec{margin-bottom:14px;}
  .cost-sec h4{font-family:'Archivo Black'; font-size:12px; color:var(--orange); margin:0 0 8px; letter-spacing:.02em;}
  .li-row{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding:10px 0; border-bottom:1px solid var(--line);}
  .li-row .li-main{flex:1; min-width:0;}
  .li-row .li-name{font-size:13.5px; font-weight:600; line-height:1.35;}
  .li-row .li-meta{font-family:'Space Mono'; font-size:11px; color:var(--concrete); margin-top:3px;}
  .li-row .li-cost{font-family:'Space Mono'; font-size:14px; font-weight:700; white-space:nowrap; text-align:right; flex-shrink:0;}
  .li-sub{display:flex; justify-content:space-between; align-items:center; padding:11px 0 2px; margin-top:2px;}
  .li-sub .ls-lbl{font-size:11px; text-transform:uppercase; letter-spacing:.08em; color:var(--concrete);}
  .li-sub .ls-val{font-family:'Space Mono'; font-size:16px; font-weight:700; color:var(--chalk); white-space:nowrap;}
  .save-list{margin:0; padding-left:17px; font-size:13px; line-height:1.6;}
  .save-list li{margin-bottom:5px;}
  .src-note{font-size:11px; color:var(--concrete); font-family:'Space Mono'; margin-top:12px; line-height:1.5;}
  .drivers{font-size:12.5px; color:var(--chalk); line-height:1.55; margin:10px 0 0; padding:10px 12px; background:rgba(76,111,165,0.12); border-left:2px solid var(--blueprint); border-radius:0 3px 3px 0;}

  /* USTAWIENIA */
  .lang-switch{display:flex; gap:8px; margin-bottom:6px;}
  .lang-switch button{flex:1; min-width:0; background:var(--charcoal-2); border:1px solid var(--line); color:var(--concrete); font-weight:700; font-size:12.5px; padding:13px 4px; border-radius:4px; display:flex; flex-direction:column; align-items:center; gap:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .lang-switch button small{font-size:10px; font-weight:400; letter-spacing:.06em; text-transform:uppercase;}
  .lang-switch button.active{background:var(--orange); color:#1B1A17; border-color:var(--orange);}
  .set-group{margin-bottom:22px;}
  .set-group h2{font-family:'Archivo Black'; font-size:13px; margin:0 0 10px; color:var(--orange); letter-spacing:.01em;}
  .toggle-row{display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid var(--line);}
  .toggle-row .tl{font-size:13.5px; font-weight:600;}
  .toggle-row .td{font-size:11.5px; color:var(--concrete); margin-top:2px; line-height:1.4;}
  .switch{position:relative; width:44px; height:25px; flex-shrink:0; margin-left:12px;}
  .switch input{opacity:0; width:0; height:0;}
  .slider{position:absolute; inset:0; background:var(--charcoal-3); border:1px solid var(--line); border-radius:25px; transition:.2s;}
  .slider:before{content:""; position:absolute; height:17px; width:17px; left:3px; bottom:3px; background:var(--concrete); border-radius:50%; transition:.2s;}
  .switch input:checked + .slider{background:var(--blueprint-dim); border-color:var(--blueprint);}
  .switch input:checked + .slider:before{transform:translateX(19px); background:var(--chalk);}
  .about-line{font-size:12px; color:var(--concrete); line-height:1.6;}
  ::-webkit-scrollbar{width:0; height:0;}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="mark">METR<span>BUDOWA</span></div>
    <div class="tag" id="hdrTag"></div>
  </header>

  <div class="views">

    <!-- POMIAR -->
    <section class="view active" id="view-pomiar">
      <div id="setupPanel" class="scroll">
        <div class="setup-panel">
          <h2 id="t_calibTitle"></h2>

          <div class="how-step">
            <div class="how-num">1</div>
            <div class="how-art">
              <svg viewBox="0 0 60 44"><rect x="2" y="2" width="56" height="40" rx="2" stroke="var(--concrete)" fill="none" stroke-width="1.2"/><rect x="20" y="12" width="14" height="20" rx="1" fill="var(--chalk)" opacity=".9"/><path d="M20 12h14v20H20z" stroke="var(--orange)" fill="none" stroke-width="1.4"/></svg>
            </div>
            <div class="how-txt"><div class="how-t" id="t_howStep1"></div><div class="how-d" id="t_howStep1d"></div></div>
          </div>

          <div class="how-step">
            <div class="how-num">2</div>
            <div class="how-art">
              <svg viewBox="0 0 60 44"><rect x="20" y="12" width="14" height="20" rx="1" stroke="var(--concrete)" fill="none" stroke-width="1.2"/><circle cx="20" cy="12" r="3.2" fill="var(--blueprint)"/><circle cx="34" cy="32" r="3.2" fill="var(--blueprint)"/><path d="M20 12L34 32" stroke="var(--blueprint)" stroke-width="1.4" stroke-dasharray="3 2"/></svg>
            </div>
            <div class="how-txt"><div class="how-t" id="t_howStep2"></div><div class="how-d" id="t_howStep2d"></div></div>
          </div>

          <div class="how-step">
            <div class="how-num">3</div>
            <div class="how-art">
              <svg viewBox="0 0 60 44"><path d="M8 8h44v28H8z" fill="var(--orange)" opacity=".14"/><path d="M8 8h44v28H8z" stroke="var(--orange)" fill="none" stroke-width="1.4" stroke-dasharray="3 2"/><circle cx="8" cy="8" r="3.2" fill="var(--orange)"/><circle cx="52" cy="8" r="3.2" fill="var(--orange)"/><circle cx="52" cy="36" r="3.2" fill="var(--orange)"/><circle cx="8" cy="36" r="3.2" fill="var(--orange)"/></svg>
            </div>
            <div class="how-txt"><div class="how-t" id="t_howStep3"></div><div class="how-d" id="t_howStep3d"></div></div>
          </div>

          <div class="field" style="margin-top:20px;">
            <label class="field-label" id="t_refLabel"></label>
            <select id="refSelect"></select>
          </div>
          <div class="field" id="customRefField" style="display:none;">
            <label class="field-label" id="t_customRefLabel"></label>
            <input type="number" id="customRefCm" min="1">
          </div>
          <button class="btn btn-primary btn-full" id="startCamBtn" style="padding:15px;font-size:15px;"></button>
        </div>
      </div>
      <div class="cam-wrap" id="camWrap" style="display:none;">
        <video id="video" autoplay playsinline muted></video>
        <canvas class="overlay" id="overlay"></canvas>
        <div class="crosshair" id="crosshair">
          <svg viewBox="0 0 60 60">
            <circle cx="30" cy="30" r="17" fill="none" stroke="rgba(245,241,232,.55)" stroke-width="1.4"/>
            <path d="M30 6v13M30 41v13M6 30h13M41 30h13" stroke="rgba(245,241,232,.85)" stroke-width="1.6"/>
            <circle cx="30" cy="30" r="2.6" fill="var(--orange)"/>
          </svg>
        </div>

        <div class="step-bar" id="stepBar">
          <div class="sb-item" data-i="1"><span class="sb-dot">1</span><span class="sb-lbl" id="t_stepBar1"></span></div>
          <div class="sb-line"></div>
          <div class="sb-item" data-i="2"><span class="sb-dot">2</span><span class="sb-lbl" id="t_stepBar2"></span></div>
          <div class="sb-line"></div>
          <div class="sb-item" data-i="3"><span class="sb-dot">3</span><span class="sb-lbl" id="t_stepBar3"></span></div>
        </div>

        <div class="hud-top">
          <div class="pill step" id="stepPill"></div>
          <div class="pill" id="calibPill"></div>
        </div>

        <div class="hud-bottom">
          <div class="readout" id="mainReadout">0.00 <small>m²</small></div>
          <div class="sub-readout" id="subReadout"></div>
          <button class="btn btn-primary btn-full" id="addPointBtn" style="margin-top:12px;padding:16px;font-size:15px;"></button>
          <div class="action-row">
            <button class="btn btn-ghost" id="undoBtn"></button>
            <button class="btn btn-ghost" id="openingBtn" disabled></button>
            <button class="btn btn-primary" id="saveBtn" disabled></button>
          </div>
        </div>
      </div>
    </section>

    <!-- KALKULATOR -->
    <section class="view" id="view-kalkulator">
      <div class="scroll"><div class="section-pad">
        <h1 class="page-title" id="t_calcTitle"></h1>
        <p class="page-sub" id="t_calcSub"></p>
        <label class="field-label" id="t_savedLabel"></label>
        <div class="chip-row" id="chipRow"></div>
        <div class="empty-note" id="chipEmpty"></div>
        <div class="field">
          <label class="field-label" id="t_areaLabel"></label>
          <input type="number" id="calcArea" step="0.1" min="0">
        </div>
        <div class="cat-scroll" id="catScroll"></div>
        <div id="materialCards"></div>
      </div></div>
    </section>

    <!-- AI -->
    <section class="view" id="view-ai">
      <div class="scroll"><div class="section-pad">
        <h1 class="page-title" id="t_aiTitle"></h1>
        <p class="page-sub" id="t_aiSub"></p>
        <div class="demo-strip" id="demoStripAi" style="display:none;"></div>
        <div class="quick-add" id="quickAdd"></div>
        <div class="field">
          <label class="field-label" id="t_taskLabel"></label>
          <textarea id="aiTaskInput" rows="4"></textarea>
        </div>
        <div class="row2" style="margin-bottom:13px;">

function guessMarket(la,ln){
  const hit=BOXES.filter(b=>la>=b[1]&&la<=b[2]&&ln>=b[3]&&ln<=b[4]);
  if(!hit.length)return null;      // poza Europą — niech decyduje AI
  // ramy się nakładają, więc wygrywa najmniejsza (najbardziej konkretna)
  hit.sort((a,b)=>((a[2]-a[1])*(a[4]-a[3]))-((b[2]-b[1])*(b[4]-b[3])));
  return marketByCode(hit[0][0]);
}

function fillRefSelect(sel,val){
  if(!sel)return;
  sel.innerHTML=T.refs.map(r=>`<option value="${r[0]}" ${r[0]===val?'selected':''}>${r[1]}</option>`).join('');

  lang=b.dataset.lang; applyLanguage();

$('marketSelect').addEventListener('change',e=>{settings.market=e.target.value; updateMarketStatus();});
function activeMarket(){
  if(settings.market!=='auto')return marketByCode(settings.market);
  return detectedMarket||null;
}
function updateMarketStatus(){
  const el=$('t_marketStatus'); if(!el)return;
  if(settings.market!=='auto'){ el.textContent=''; return; }
  const m=detectedMarket;
  el.textContent = m ? T.marketDetected((lang==='pl'?m.pl:m.en)+' · '+m.cur) : T.marketNoGps;
}
/* fragment promptu opisujacy rynek — wspolny dla wszystkich zapytan AI */
function marketPrompt(){
  // 1) rynek wybrany ręcznie — wiążący
  if(settings.market!=='auto'){
    const m=marketByCode(settings.market);
    if(m)return lang==='pl'
      ? `RYNEK: ${m.pl}. Szukaj cen w tamtejszych sklepach (np. ${m.shops}). Wszystkie kwoty w walucie ${m.cur}; ustaw "waluta":"${m.cur}".`
      : `MARKET: ${m.en}. Search prices at local retailers (e.g. ${m.shops}). All amounts in ${m.cur}; set "waluta":"${m.cur}".`;
  }
  // 2) tryb automatyczny ze współrzędnymi — AI sam ustala kraj, podpowiedź jest tylko wskazówką
  if(lastCoords){
    const g=detectedMarket;
    return lang==='pl'
      ? `RYNEK: ustal kraj na podstawie współrzędnych ${lastCoords.la}, ${lastCoords.ln}${g?` (prawdopodobnie ${g.pl} — ZWERYFIKUJ, współrzędne są ważniejsze niż ta podpowiedź)`:''}. Szukaj cen w sklepach budowlanych działających w TYM kraju, użyj jego waluty i wpisz ją w "waluta".`
      : `MARKET: determine the country from coordinates ${lastCoords.la}, ${lastCoords.ln}${g?` (likely ${g.en} — VERIFY, the coordinates outrank this hint)`:''}. Search retailers operating in THAT country, use its currency and put it in "waluta".`;
  }
  // 3) brak lokalizacji — kraj wg języka interfejsu
  const f=lang==='pl'?marketByCode('PL'):marketByCode('GB');
  return lang==='pl'
    ? `RYNEK: nie podano lokalizacji — przyjmij ${f.pl} i ustaw "waluta":"${f.cur}". Zaznacz w "zrodla", że przyjęto rynek domyślny.`
    : `MARKET: no location given — assume ${f.en} and set "waluta":"${f.cur}". Note in "zrodla" that a default market was assumed.`;
}
$('defRefSelect').addEventListener('change',e=>{
  settings.defRef=e.target.value; fillRefSelect($('refSelect'),settings.defRef);
});
$('wasteInput').addEventListener('input',e=>{settings.waste=parseFloat(e.target.value)||0; recalcAll();});
$('unitsToggle').addEventListener('change',e=>{settings.imperial=e.target.checked; applyLanguage(); recalcAll(); updateUI();});
$('roundToggle').addEventListener('change',e=>{settings.roundPacks=e.target.checked; recalcAll();});
$('searchToggle').addEventListener('change',e=>{settings.webSearch=e.target.checked;});
$('gpsToggle').addEventListener('change',e=>{settings.useGps=e.target.checked;});
$('defStdSelect').addEventListener('change',e=>{settings.defStd=e.target.selectedIndex; $('aiStandard').selectedIndex=settings.defStd;});
$('clearBtn').addEventListener('click',()=>{
  if(confirm(T.clearConfirm)){state.savedMeasurements=[]; renderChips(); renderCostChips(); refreshSettingsView();}
});
function refreshSettingsView(){
  setTxt('t_savedCount',T.savedCount(state.savedMeasurements.length));
  $('marketSelect').value=settings.market; updateMarketStatus();
  $('wasteInput').value=settings.waste;
  $('unitsToggle').checked=settings.imperial;
  $('roundToggle').checked=settings.roundPacks;
  $('searchToggle').checked=settings.webSearch;
  $('gpsToggle').checked=settings.useGps;
}

/* ==================== KAMERA / POMIAR ==================== */
const refSelect=$('refSelect'),customRefField=$('customRefField'),customRefCm=$('customRefCm');
refSelect.addEventListener('change',()=>customRefField.style.display=refSelect.value==='custom'?'block':'none');
const video=$('video'),overlay=$('overlay'),ctx=overlay.getContext('2d');
const camWrap=$('camWrap'),setupPanel=$('setupPanel');
const stepPill=$('stepPill'),calibPill=$('calibPill');
const mainReadout=$('mainReadout'),subReadout=$('subReadout');
const undoBtn=$('undoBtn'),openingBtn=$('openingBtn'),saveBtn=$('saveBtn');

$('startCamBtn').addEventListener('click',async()=>{
  state.refCm=refSelect.value==='custom'?(parseFloat(customRefCm.value)||150):parseFloat(refSelect.value);
  try{
    const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    video.srcObject=s; await video.play();
    setupPanel.style.display='none'; camWrap.style.display='block';
    resizeCanvas(); window.addEventListener('resize',resizeCanvas); draw();
  }catch(e){
    setupPanel.querySelector('.setup-panel').innerHTML=
      `<div style="padding-top:20px;"><p class="hint" style="color:#D9A441;">${T.camErr(e.name)}</p>
       <button class="btn btn-ghost" onclick="location.reload()">${T.retry}</button></div>`;
  }
});
function resizeCanvas(){overlay.width=overlay.clientWidth;overlay.height=overlay.clientHeight;draw();}
/* aktywna lista punktów zależy od etapu */
function activePoints(){
  if(state.mode==='calibrate')return state.calibPoints;
  if(state.mode==='opening')return state.currentOpeningPoints;
  return state.mainPoints;
}
function addPointAt(x,y){
  if(state.mode==='calibrate'){
    if(state.calibPoints.length<2)state.calibPoints.push({x,y});
    if(state.calibPoints.length===2)finishCalib();
  } else activePoints().push({x,y});
  updateUI(); draw();
}
/* przycisk: punkt ląduje dokładnie pod krzyżykiem na środku ekranu */
$('addPointBtn').addEventListener('click',()=>{
  addPointAt(overlay.width/2, overlay.height/2);
  const c=$('crosshair'); c.classList.add('pulse'); setTimeout(()=>c.classList.remove('pulse'),140);
  if(navigator.vibrate)navigator.vibrate(18);
});

/* dotyk: blisko istniejącego punktu = przeciąganie, dalej = nowy punkt */
let dragIdx=null;
const HIT=26; // promień trafienia w px
overlay.addEventListener('pointerdown',e=>{
  const r=overlay.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
  const pts=activePoints();
  let best=-1,bestD=HIT;
  pts.forEach((pt,i)=>{const d=Math.hypot(pt.x-x,pt.y-y); if(d<bestD){bestD=d;best=i;}});
  if(best>=0){ dragIdx=best; overlay.setPointerCapture(e.pointerId); return; }
  addPointAt(x,y);
});
overlay.addEventListener('pointermove',e=>{
  if(dragIdx===null)return;
  const r=overlay.getBoundingClientRect();
  const pts=activePoints();
  pts[dragIdx]={x:e.clientX-r.left, y:e.clientY-r.top};
  if(state.mode==='calibrate'&&state.calibPoints.length===2)finishCalib();
  updateUI(); draw();
});
overlay.addEventListener('pointerup',()=>{dragIdx=null;});
overlay.addEventListener('pointercancel',()=>{dragIdx=null;});
undoBtn.addEventListener('click',()=>{
  if(state.mode==='calibrate')state.calibPoints.pop();
  else if(state.mode==='measure')state.mainPoints.pop();
  else state.currentOpeningPoints.pop();
  updateUI(); draw();
});
openingBtn.addEventListener('click',()=>{
  if(state.mode==='opening'){
    if(state.currentOpeningPoints.length>=3)state.openings.push({points:state.currentOpeningPoints});
    state.currentOpeningPoints=[]; state.mode='measure'; openingBtn.textContent=T.addOpening;
  }else{state.mode='opening'; state.currentOpeningPoints=[]; openingBtn.textContent=T.closeOpening;}
  updateUI(); draw();
});
saveBtn.addEventListener('click',()=>{
  const a=computeNetAreaM2(); if(a<=0)return;
  const n=prompt(T.savePrompt,T.surfaceN(state.savedMeasurements.length+1));
  if(n===null)return;
  state.savedMeasurements.push({id:Date.now(),name:n||T.surfaceN(state.savedMeasurements.length+1),area:a,perimeter:computePerimeterM(state.mainPoints)});
  state.mainPoints=[];state.openings=[];state.mode='measure';
  updateUI(); draw(); renderChips(); renderCostChips(); refreshSettingsView();
});
function finishCalib(){
  const [a,b]=state.calibPoints;
  state.pxPerCm=Math.hypot(b.x-a.x,b.y-a.y)/state.refCm; state.mode='measure';
  calibPill.innerHTML=T.scale+': <b>'+state.pxPerCm.toFixed(1)+' px/cm</b>';
}
const M2_TO_FT2=10.7639;
function dispArea(m2){return settings.imperial?m2*M2_TO_FT2:m2;}
function dispLen(m){return settings.imperial?m*3.28084:m;}
function areaUnit(){return settings.imperial?T.sqft:T.m2;}
function lenUnit(){return settings.imperial?'ft':'m';}

function setStepBar(active,done){
  document.querySelectorAll('.sb-item').forEach(el=>{
    const i=+el.dataset.i;
    el.classList.toggle('active',i===active);
    el.classList.toggle('done',i<active||(done&&i===active));
  });
}
function updateUI(){
  const n=state.mainPoints.length;
  if(state.mode==='calibrate'){
    stepPill.textContent=(state.calibPoints.length===0?T.step1:T.step2)+' · '+T.aimHint;
    openingBtn.disabled=true; saveBtn.disabled=true;
    if(!state.pxPerCm)calibPill.innerHTML=T.scale+': <b>—</b>';
    setStepBar(1,false);
  }else{
    stepPill.textContent=n<3?T.stepPoly(n):(state.mode==='opening'?T.stepOpen(state.currentOpeningPoints.length):T.stepReady+' · '+T.dragHint);
    openingBtn.disabled=n<3; saveBtn.disabled=n<3;
    setStepBar(n>=3?3:2, n>=3);
  }
  const ch=$('crosshair');
  if(ch)ch.classList.toggle('hidden', n>=3&&state.mode==='measure');
  const btn=$('addPointBtn');
  if(btn){
    btn.textContent=T.addPoint;
    // po zamknięciu obrysu przycisk mniej rzuca się w oczy
    btn.className='btn btn-full '+(n>=3&&state.mode==='measure'?'btn-ghost':'btn-primary');
    btn.style.cssText='margin-top:12px;padding:'+(n>=3&&state.mode==='measure'?'12px':'16px')+';font-size:'+(n>=3&&state.mode==='measure'?'13.5px':'15px')+';';
  }
  const a=computeNetAreaM2(),p=computePerimeterM(state.mainPoints);
  mainReadout.innerHTML=dispArea(a).toFixed(2)+' <small>'+areaUnit()+'</small>';
  subReadout.textContent=T.perim+': '+(p?dispLen(p).toFixed(2)+' '+lenUnit():'—')+' · '+T.points+': '+state.mainPoints.length+(state.openings.length?' · '+T.openings+': '+state.openings.length:'');
}
function shoelace(p){if(p.length<3)return 0;let s=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];s+=a.x*b.y-b.x*a.y;}return Math.abs(s)/2;}
function perimPx(p){if(p.length<3)return 0;let s=0;for(let i=0;i<p.length;i++){const a=p[i],b=p[(i+1)%p.length];s+=Math.hypot(b.x-a.x,b.y-a.y);}return s;}
function computeNetAreaM2(){
  if(!state.pxPerCm||state.mainPoints.length<3)return 0;
  const c=x=>x/(state.pxPerCm*state.pxPerCm)/10000;
  let a=c(shoelace(state.mainPoints));
  state.openings.forEach(o=>a-=c(shoelace(o.points)));
  return Math.max(a,0);
}
function computePerimeterM(p){return(!state.pxPerCm||p.length<3)?0:perimPx(p)/state.pxPerCm/100;}
function draw(){
  ctx.clearRect(0,0,overlay.width,overlay.height);
  const poly=(pts,col,fill,close)=>{
    if(!pts.length)return;
    ctx.strokeStyle=col;ctx.lineWidth=2;ctx.setLineDash([6,5]);ctx.beginPath();
    pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));
    if(close&&pts.length>2)ctx.closePath();
    ctx.stroke();ctx.setLineDash([]);
    if(close&&pts.length>2&&fill){ctx.fillStyle=col.replace('1)',fill+')');ctx.fill();}
    pts.forEach((p,i)=>{
      // obwódka ułatwia trafienie palcem i pokazuje, że punkt da się przeciągnąć
      ctx.beginPath();ctx.arc(p.x,p.y,13,0,7);
      ctx.fillStyle=col.replace('1)','0.18)');ctx.fill();
      ctx.beginPath();ctx.arc(p.x,p.y,7,0,7);
      ctx.fillStyle=col;ctx.fill();
      ctx.strokeStyle='#1B1A17';ctx.lineWidth=2;ctx.stroke();
      // numer punktu
      ctx.fillStyle='#1B1A17';ctx.font='bold 9px Barlow, sans-serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(String(i+1),p.x,p.y);
    });
  };
  if(state.mode==='calibrate')poly(state.calibPoints,'rgba(76,111,165,1)',null,false);
  else{
    poly(state.mainPoints,'rgba(232,93,47,1)',0.14,state.mainPoints.length>2);
    state.openings.forEach(o=>poly(o.points,'rgba(217,164,65,1)',0.18,true));
    if(state.mode==='opening')poly(state.currentOpeningPoints,'rgba(217,164,65,1)',0.1,state.currentOpeningPoints.length>2);
  }
}

let activeCat='Malowanie';
const catScroll=$('catScroll'),materialCardsEl=$('materialCards');
function matName(m){return lang==='en'?m.en:(lang==='nl'?(m.nl||m.en):m.pl);}
function matPack(m){return lang==='en'?m.packEn:(lang==='nl'?(m.packNl||m.packEn):m.packPl);}
function matUnit(m){return (lang!=='pl'&&m.unitEn)?m.unitEn:m.unit;}
const CAT_ORDER=['Malowanie','ŚcianyDekor','Tynki','Regipsy','Sufity','Płytki','Łazienka','Podłogi','Ogrzewanie','Elektryka','Chemia','Izolacja','Dach','Zewnętrzne'];
function buildCats(){
  const present=[...new Set(MATERIALS.map(m=>m.cat))];
  const cats=CAT_ORDER.filter(c=>present.includes(c)).concat(present.filter(c=>!CAT_ORDER.includes(c)));
  catScroll.innerHTML=cats.map(c=>`<button class="cat-btn ${c===activeCat?'active':''}" data-cat="${c}">${T.cats[c]}</button>`).join('');
  catScroll.querySelectorAll('.cat-btn').forEach(b=>b.addEventListener('click',()=>{
    activeCat=b.dataset.cat;
    catScroll.querySelectorAll('.cat-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); buildCards();
  }));
}
function buildCards(){
  materialCardsEl.innerHTML=MATERIALS.filter(m=>m.cat===activeCat).map(m=>{
    const i=MATERIALS.indexOf(m), u=matUnit(m);
    const per=m.perMb?(lang==='pl'?'mb':'lm'):areaUnit();
    return `<div class="card" data-idx="${i}">
      <div class="card-head"><div class="name">${matName(m)}</div><div class="eyebrow">${u}/${per}</div></div>
      <div class="row2">
        <div><label class="field-label">${T.coverage}</label><input type="number" step="0.01" class="cov-input" value="${m.cov}"></div>
        <div><label class="field-label">${T.layers}</label><input type="number" step="1" min="1" class="layers-input" value="${m.layers}"></div>
      </div>
      <div class="result-line"><span class="lbl">${T.need}</span><span class="num out-qty">—</span></div>
      <div class="result-line" style="border-top:none;margin-top:1px;padding-top:1px;"><span class="lbl">${matPack(m)}</span><span class="num out-packs" style="font-size:16px;">—</span></div>
    </div>`;}).join('');
  materialCardsEl.querySelectorAll('input').forEach(i=>i.addEventListener('input',recalcAll));
  recalcAll();
}
const calcAreaInput=$('calcArea');
calcAreaInput.addEventListener('input',recalcAll);
function recalcAll(){
  let area=Math.max(0,parseFloat(calcAreaInput.value)||0);
  if(settings.imperial)area=area/M2_TO_FT2;
  const act=document.querySelector('.saved-chip.active');
  let perim=0;
  if(act){const sm=state.savedMeasurements.find(x=>x.id==act.dataset.id); perim=sm?sm.perimeter:0;}
  else if(area>0)perim=4*Math.sqrt(area);
  materialCardsEl.querySelectorAll('.card').forEach(card=>{
    const m=MATERIALS[card.dataset.idx];
    const cov=parseFloat(card.querySelector('.cov-input').value)||m.cov;
    const layers=parseFloat(card.querySelector('.layers-input').value)||1;
    const base=m.perMb?perim:area;
    let qty=base*cov*layers;
    if(m.waste)qty*=(1+settings.waste/100);
    const packs=qty>0?(settings.roundPacks?Math.ceil(qty/m.pack):(qty/m.pack)):0;
    const u=matUnit(m);
    card.querySelector('.out-qty').textContent=qty>0?qty.toFixed(1)+' '+u:'—';
    card.querySelector('.out-packs').textContent=packs>0?(settings.roundPacks?packs:packs.toFixed(1))+' ×':'—';
  });
}
const chipRow=$('chipRow'),chipEmpty=$('chipEmpty');
function renderChips(){
  if(!state.savedMeasurements.length){chipRow.innerHTML='';chipEmpty.style.display='block';return;}
  chipEmpty.style.display='none';
  chipRow.innerHTML=state.savedMeasurements.map(s=>`<span class="saved-chip" data-id="${s.id}">${s.name} · ${dispArea(s.area).toFixed(2)} ${areaUnit()}</span>`).join('');
  chipRow.querySelectorAll('.saved-chip').forEach(c=>c.addEventListener('click',()=>{
    chipRow.querySelectorAll('.saved-chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
    const sm=state.savedMeasurements.find(x=>x.id==c.dataset.id);
    calcAreaInput.value=dispArea(sm.area).toFixed(2); recalcAll();
  }));
}

  if(useSearch&&settings.webSearch)body.tools=[{type:"web_search_20250305",name:"web_search"}];

function mdToHtml(t){
  return t.replace(/^#{2,3} (.+)$/gm,'<h3>$1</h3>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/^- (.+)$/gm,'<li>$1</li>')
    .replace(/(<li>[\s\S]*?<\/li>)(?!\s*<li>)/g,'<ul>$1</ul>')
    .replace(/\n{2,}/g,'<br><br>');
}
function renderRich(t){
  const lines=t.split('\n'); let out=[],i=0;
  while(i<lines.length){
    const l=lines[i];
    if(/^\s*\|/.test(l)&&/^\s*\|/.test(lines[i+1]||'')&&/-/.test(lines[i+1]||'')){
      const head=l.split('|').slice(1,-1).map(s=>s.trim());
      i+=2; let rows=[];
      while(i<lines.length&&/^\s*\|/.test(lines[i])){rows.push(lines[i].split('|').slice(1,-1).map(s=>s.trim()));i++;}
      out.push('<table><tr>'+head.map(h=>'<th>'+h+'</th>').join('')+'</tr>'+
        rows.map(r=>'<tr>'+r.map(c=>'<td>'+c.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')+'</td>').join('')+'</tr>').join('')+'</table>');
      continue;
    }
    out.push(l); i++;
  }
  return mdToHtml(out.join('\n'));
}

function parseJson(raw){
  if(!raw)return null;
  let s=raw.replace(/```json|```/g,'');
  const a=s.indexOf('{');
  if(a<0)return null;
  s=s.slice(a);
  // 1) normalna próba — od pierwszego { do ostatniego }
  const b=s.lastIndexOf('}');
  if(b>0){ try{ return JSON.parse(s.slice(0,b+1)); }catch(e){} }
  // 2) ratunek dla uciętej odpowiedzi: doklej brakujące nawiasy
  return repairJson(s);
}
function repairJson(s){
  // utnij ogon do ostatniego miejsca, które może kończyć wartość
  for(let cut=s.length; cut>50; cut--){
    const ch=s[cut-1];
    if(ch!=='}'&&ch!==']'&&ch!=='"'&&!/[0-9]/.test(ch))continue;
    let t=s.slice(0,cut);
    // policz otwarte struktury poza stringami
    let inStr=false, esc=false, stack=[];
    for(const c of t){
      if(inStr){ if(esc)esc=false; else if(c==='\\')esc=true; else if(c==='"')inStr=false; continue; }
      if(c==='"')inStr=true;
      else if(c==='{'||c==='[')stack.push(c);
      else if(c==='}'||c===']')stack.pop();
    }
    if(inStr)continue;                 // ucięte w środku tekstu — cofnij dalej
    t=t.replace(/,\s*$/,'');           // wiszący przecinek
    if(/[:,]\s*$/.test(t))continue;    // ucięte tuż po kluczu
    const close=stack.reverse().map(c=>c==='{'?'}':']').join('');
    try{ return JSON.parse(t+close); }catch(e){}
  }
  return null;
}

 "kosztOd":200,
 "kosztDo":270,
 "kosztZaM2":"£8-11/m²",
 "coDecyduje":"One sentence on what moves the cost within the range.",
 "oszczednosci":["point 1","point 2"],
 "zrodla":"January 2026, Screwfix and B&Q"
}

RULES (CRITICAL — the reply must be short or it will be cut off):
- Start with { and end with }. No text, working out or comments outside the JSON.
- "koszt" is a NUMBER (no currency, no range, no spaces) — a single mid-point value.
- Character limits: "nazwa" 34, "cenaJedn" 16, "stawka" 16, "coDecyduje" 110, each saving 70, "zrodla" 45.
- Maximum 6 material items, 3 labour stages, 5 tools.
- Real prices from your search.
- Tools: "cena" is a NUMBER (purchase or hire), "tryb" is "kup", "wypozycz" or "mam". Use "cena":0 for "mam".
- If hiring a tradesperson: "narzedzia":[] and "sumaNarzedzi":0 (they bring their own).
- If doing it themselves: "robocizna":[] and "sumaRobocizny":0, but DO list tools with prices.
- "kosztOd"/"kosztDo" must cover materials + labour + tools.`+langRule();
  try{
    const raw=await callClaude([{role:"user",content:p}],true,"wycena");
    costOutput.innerHTML=renderCost(raw);
  }catch(e){costOutput.innerHTML=`<div class="err-box">${T.aiErr(e.message)}</div>`;}
});

function fmtMoney(n,cur){
  if(typeof n!=='number'||!isFinite(n))return '—';
  const s=Math.round(n).toLocaleString(lang==='pl'?'pl-PL':'en-GB');
  return cur==='£'||cur==='$' ? cur+s : s+' '+cur;
}
function renderCost(raw){
  const d=parseJson(raw);
  if(!d){
    return '<div class="ai-out"><div class="ai-badge" style="margin-bottom:10px;">'+T.costBadge+'</div>'+renderRich(raw)+'</div>';
  }
  const cur=d.waluta||'zł';
  const mats=(Array.isArray(d.materialy)?d.materialy:[]).filter(x=>x&&x.nazwa);
  const lab=(Array.isArray(d.robocizna)?d.robocizna:[]).filter(x=>x&&x.nazwa);
  const sumM=typeof d.sumaMaterialow==='number'?d.sumaMaterialow:mats.reduce((s,x)=>s+(x.koszt||0),0);
  const sumL=typeof d.sumaRobocizny==='number'?d.sumaRobocizny:lab.reduce((s,x)=>s+(x.koszt||0),0);
  const sumT=toolsTotal(d,cur);
  const from=d.kosztOd, to=d.kosztDo;
  const totalTxt = (typeof from==='number'&&typeof to==='number')
    ? fmtMoney(from,cur)+' – '+fmtMoney(to,cur)
    : fmtMoney(sumM+sumL+sumT,cur);

  const row=x=>`<div class="li-row">
      <div class="li-main"><div class="li-name">${esc(x.nazwa||'')}</div>
      <div class="li-meta">${esc(x.ilosc||x.stawka||'')}${x.ilosc&&x.cenaJedn?' · '+esc(x.cenaJedn):''}</div></div>
      <div class="li-cost">${fmtMoney(x.koszt,cur)}</div></div>`;

  return `<div class="ai-out" style="border-color:var(--line);">
    <div class="ai-badge" style="margin-bottom:12px;">${T.costBadge}</div>${demoBadge()}

    <div class="cost-total">
      <div class="ct-lbl">${T.ctTotal}</div>
      <div class="ct-val">${totalTxt}</div>
      ${d.kosztZaM2?`<div class="ct-per">${esc(d.kosztZaM2)}</div>`:''}
      <div class="ct-split">
        <div><div class="s-lbl">${T.ctMaterials}</div><div class="s-val" style="color:var(--blueprint);">${fmtMoney(sumM,cur)}</div></div>
        ${sumL>0?`<div><div class="s-lbl">${T.ctLabour}</div><div class="s-val" style="color:var(--ok);">${fmtMoney(sumL,cur)}</div></div>`:''}
        ${sumT>0?`<div><div class="s-lbl">${T.ctTools}</div><div class="s-val" style="color:var(--warn);">${fmtMoney(sumT,cur)}</div></div>`:''}
      </div>
    </div>

    ${d.coDecyduje?`<div class="drivers"><strong>${T.drivers}:</strong> ${esc(d.coDecyduje)}</div>`:''}

    ${mats.length?`<div class="cost-sec" style="margin-top:18px;">
      <h4>${T.secMaterials}</h4>
      ${mats.map(row).join('')}
      <div class="li-sub"><span class="ls-lbl">${T.subMaterials}</span><span class="ls-val">${fmtMoney(sumM,cur)}</span></div>
    </div>`:''}

    ${lab.length?`<div class="cost-sec">
      <h4>${T.secLabour}</h4>
      ${lab.map(row).join('')}
      <div class="li-sub"><span class="ls-lbl">${T.subLabour}</span><span class="ls-val">${fmtMoney(sumL,cur)}</span></div>
    </div>`:''}

    ${toolsSection(d.narzedzia,d.sumaNarzedzi,cur)}

    ${Array.isArray(d.oszczednosci)&&d.oszczednosci.length?`<div class="cost-sec">
      <h4>${T.secSave}</h4>
      <ul class="save-list">${d.oszczednosci.map(s=>'<li>'+esc(s)+'</li>').join('')}</ul>
    </div>`:''}

    ${d.zrodla?`<div class="src-note">${T.srcPrefix} ${esc(d.zrodla)}</div>`:''}
    <p style="font-size:11.5px;color:var(--concrete);line-height:1.55;margin:12px 0 0;border-top:1px solid var(--line);padding-top:10px;">${T.costDisclaimer}</p>
    ${demoNote()}
  </div>`;
}
function demoBadge(){return DEMO_MODE?`<span class="demo-badge">${T.demoBadge}</span>`:'';}
function demoNote(){return DEMO_MODE?`<div class="demo-note">${T.demoNote}</div>`:'';}
function esc(s){return String(s).replace(/[<>&]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[c]));}

/* wspólny komponent: narzędzia z cenami */
function toolMode(t){
  const m=String(t||'').toLowerCase();
  if(m.startsWith('wypo')||m==='hire'||m==='rent')return {lbl:T.toolRent,col:'var(--warn)'};
  if(m==='mam'||m==='have'||m==='own')return {lbl:T.toolHave,col:'var(--concrete)'};
  return {lbl:T.toolBuy,col:'var(--blueprint)'};
}
function toolsSection(arr,sum,cur){
  if(!Array.isArray(arr)||!arr.length)return '';
  if(typeof arr[0]!=='string')arr=arr.filter(x=>x&&x.nazwa);
  if(!arr.length)return '';
  // zgodność wstecz: gdyby AI zwróciło zwykłą listę tekstów
  if(typeof arr[0]==='string')
    return `<div class="cost-sec"><h4>${T.secTools}</h4>
      <ul class="save-list">${arr.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></div>`;
  const total=typeof sum==='number'?sum:arr.reduce((s,x)=>s+(x.cena||0),0);
  return `<div class="cost-sec"><h4>${T.secTools}</h4>
    ${arr.map(x=>{const m=toolMode(x.tryb);
      return `<div class="li-row">
        <div class="li-main"><div class="li-name">${esc(x.nazwa||'')}</div>
        <div class="li-meta" style="color:${m.col};">${m.lbl}</div></div>
        <div class="li-cost" style="${(x.cena||0)===0?'color:var(--concrete);':''}">${(x.cena||0)===0?'—':fmtMoney(x.cena,cur)}</div></div>`;}).join('')}
    ${total>0?`<div class="li-sub"><span class="ls-lbl">${T.subTools}</span><span class="ls-val">${fmtMoney(total,cur)}</span></div>`:''}
  </div>`;
}
function toolsTotal(d,cur){
  const arr=Array.isArray(d.narzedzia)?d.narzedzia:[];
  if(!arr.length||typeof arr[0]==='string')return 0;
  return typeof d.sumaNarzedzi==='number'?d.sumaNarzedzi:arr.reduce((s,x)=>s+(x.cena||0),0);
}

/* ==================== WYSZUKIWARKA WYKONAWCÓW ==================== */
const proOutput=$('proOutput');
$('proBtn').addEventListener('click',async()=>{
  const trade=$('proTrade').value.trim();
  const area=$('proArea').value.trim()||$('costRegion').value.trim();
  if(!trade){proOutput.innerHTML=`<div class="err-box">${T.proNoTrade}</div>`;return;}
  proOutput.innerHTML=`<div class="loading-box"><span class="spinner"></span>${T.proLoading}</div>`;

  const loc = area ? (lang==='pl'?`OKOLICA: ${area}`:`AREA: ${area}`)
    : (lastCoords ? (lang==='pl'?`OKOLICA: ustal z współrzędnych ${lastCoords.la}, ${lastCoords.ln}`:`AREA: determine from coordinates ${lastCoords.la}, ${lastCoords.ln}`)
                  : (lang==='pl'?'OKOLICA: nie podano — poproś o podanie miasta w polu wyżej':'AREA: not given — ask for a city in the field above'));

  const p = lang==='pl' ? `Wyszukaj w internecie fachowców i firmy, którzy PUBLICZNIE ogłaszają usługi.

SZUKANY FACHOWIEC: ${trade}
${loc}
${marketPrompt()}

Przeszukaj portale ogłoszeniowe i strony firmowe działające w tym kraju.

Odpowiedz WYŁĄCZNIE obiektem JSON, bez markdown i bez tekstu poza nim. Teksty PO POLSKU:

{
 "okolica":"Kraków i okolice",
 "wykonawcy":[{"nazwa":"Nazwa z ogłoszenia","typ":"firma","zakres":"glazura, hydraulika","gdzie":"Kraków-Podgórze","zrodlo":"Oferteo","link":"https://..."}],
 "jakSprawdzic":["punkt 1","punkt 2"],
 "uwaga":"Jedno zdanie, jeśli wyników jest mało lub są niepewne."
}

ZASADY (KRYTYCZNE):
- Zacznij od { i skończ na }. Zero tekstu poza JSON-em.
- Maksymalnie 6 wykonawców. "nazwa" 40 znaków, "zakres" 45, "gdzie" 30, "zrodlo" 20.
- "typ" to "firma" albo "freelancer".
- "link" to prawdziwy adres ogłoszenia lub strony znaleziony w wyszukiwaniu. Jeśli nie masz pewnego linku, pomiń tego wykonawcę.
- NIE twórz własnych ocen, gwiazdek ani rankingu. Nie porządkuj według jakości. Nie wymyślaj nazwisk osób prywatnych — podawaj nazwy, pod którymi ogłaszają się publicznie.
- Jeśli nic nie znajdziesz, zwróć "wykonawcy":[] i wyjaśnij to w "uwaga".
- "jakSprawdzic": 2-3 krótkie punkty, jak zweryfikować wykonawcę przed zleceniem.`
  : `Search the web for tradespeople and firms who PUBLICLY advertise their services.

TRADE WANTED: ${trade}
${loc}
${marketPrompt()}

Search listing portals and company sites operating in that country.

Reply with a JSON object ONLY, no markdown, no text outside it. Strings IN ENGLISH:

{
 "okolica":"Manchester and surroundings",
 "wykonawcy":[{"nazwa":"Name from the listing","typ":"firma","zakres":"tiling, plumbing","gdzie":"Salford","zrodlo":"Checkatrade","link":"https://..."}],
 "jakSprawdzic":["point 1","point 2"],
 "uwaga":"One sentence if results are few or uncertain."
}

RULES (CRITICAL):
- Start with { and end with }. No text outside the JSON.
- Max 6 tradespeople. "nazwa" 40 chars, "zakres" 45, "gdzie" 30, "zrodlo" 20.
- "typ" is "firma" or "freelancer".
- "link" must be a real listing or site URL found in your search. If you have no reliable link, omit that entry.
- Do NOT invent ratings, stars or a ranking. Do not order by quality. Do not invent private individuals' names — use the names they advertise under.
- If you find nothing, return "wykonawcy":[] and explain in "uwaga".
- "jakSprawdzic": 2-3 short points on how to vet a contractor before hiring.`+langRule();
  try{
    proOutput.innerHTML=renderPros(await callClaude([{role:"user",content:p}],true,"wykonawcy"));
  }catch(e){proOutput.innerHTML=`<div class="err-box">${T.aiErr(e.message)}</div>`;}
});

function renderPros(raw){
  const d=parseJson(raw);
  if(!d)return '<div class="ai-out">'+renderRich(raw)+'</div>';
  const pros=(Array.isArray(d.wykonawcy)?d.wykonawcy:[]).filter(x=>x&&x.nazwa);
  const typeLbl=t=>String(t||'').toLowerCase().startsWith('free')?T.proTypeFreelance:T.proTypeFirm;
  return `<div class="ai-out" style="border-color:var(--line);">
    <div class="ai-badge" style="margin-bottom:12px;">${T.proBadge}</div>${demoBadge()}
    ${d.okolica?`<div class="li-meta" style="margin-bottom:12px;font-size:12px;">${esc(d.okolica)}</div>`:''}
    ${pros.length? pros.map(x=>`<div class="li-row" style="align-items:center;">
        <div class="li-main">
          <div class="li-name">${esc(x.nazwa)}</div>
          <div class="li-meta">${typeLbl(x.typ)}${x.gdzie?' · '+esc(x.gdzie):''}${x.zakres?' · '+esc(x.zakres):''}</div>
          ${x.link?`<div style="margin-top:5px;"><a href="${esc(x.link)}" target="_blank" rel="noopener" style="color:var(--orange);font-size:12px;text-decoration:none;">${T.proSource}: ${esc(x.zrodlo||'link')} →</a></div>`:''}
        </div></div>`).join('')
      : `<div class="empty-note" style="font-style:normal;">${esc(d.uwaga||'')}</div>`}
    ${d.uwaga&&pros.length?`<div class="drivers" style="margin-top:12px;">${esc(d.uwaga)}</div>`:''}
    ${Array.isArray(d.jakSprawdzic)&&d.jakSprawdzic.length?`<div class="cost-sec" style="margin-top:16px;">
      <h4>${T.secSave.replace(/.*/,lang==='pl'?'Jak zweryfikować':'How to vet them')}</h4>
      <ul class="save-list">${d.jakSprawdzic.map(x=>'<li>'+esc(x)+'</li>').join('')}</ul></div>`:''}
    <p style="font-size:11.5px;color:var(--concrete);line-height:1.55;margin:14px 0 0;border-top:1px solid var(--line);padding-top:10px;">${T.proNote}</p>
    ${demoNote()}
  </div>`;
}

/* ==================== SKLEPY / GPS ==================== */
const storeResults=$('storeResults'),locateBtn=$('locateBtn');
locateBtn.addEventListener('click',()=>{
  if(!settings.useGps){storeResults.innerHTML=`<div class="err-box">${T.gpsOff}</div>`;return;}
  if(!navigator.geolocation){noLoc();return;}
  locateBtn.disabled=true; locateBtn.textContent=T.locating;
  navigator.geolocation.getCurrentPosition(async pos=>{
    const la=pos.coords.latitude.toFixed(4), ln=pos.coords.longitude.toFixed(4);
    lastCoords={la,ln};
    detectedMarket=guessMarket(parseFloat(la),parseFloat(ln));
    updateMarketStatus();
    locateBtn.textContent=T.analyzingStores;
    storeResults.innerHTML=`<div class="loading-box"><span class="spinner"></span>${T.storesLoading}</div>`;
    const q=$('priceQuery').value.trim();
    const p = lang==='pl' ? `Współrzędne użytkownika: ${la}, ${ln}.

Ustal kraj, miejscowość/dzielnicę i wyszukaj w internecie sklepy budowlane oraz hurtownie w tej okolicy. Podaj sieci działające w TYM kraju.${q?' Użytkownik szuka: "'+q+'".':''}

Odpowiedz PO POLSKU:

## Okolica
Jedno zdanie: jaka to miejscowość/rejon.

## Sklepy
Tabela: | Sklep | Gdzie | Czym się wyróżnia |
3-6 pozycji, duże sieci i lokalne hurtownie. W kolumnie "Gdzie" ulica lub dzielnica.

## Gdzie po co
3-4 punkty: który typ sklepu do jakich zakupów.

Bez wstępu. Jeśli czegoś nie ustalisz, napisz to wprost zamiast zgadywać.`
    : `User coordinates: ${la}, ${ln}.

Identify the country and town/district, then search the web for builders merchants and DIY stores in that area. List chains that actually operate in THAT country.${q?' The user is looking for: "'+q+'".':''}

Answer IN ENGLISH:

## Area
One sentence: which town/district this is.

## Shops
Table: | Shop | Where | What it is good for |
3-6 entries, both large chains and local merchants. Put a street or district in "Where".

## What to buy where
3-4 bullets: which type of shop suits which purchases.

No intro. If you cannot establish something, say so rather than guessing.`+langRule();
    try{
      const txt=await callClaude([{role:"user",content:p}],true,"sklepy");
      storeResults.innerHTML='<div class="ai-out"><div class="ai-badge" style="margin-bottom:10px;">'+T.storesBadge+'</div>'+demoBadge()+renderRich(txt)+demoNote()+
        `</div><a href="https://www.google.com/maps/search/builders+merchant/@${la},${ln},13z" target="_blank" style="text-decoration:none;">
        <div class="card" style="display:flex;align-items:center;justify-content:space-between;margin-top:11px;">
        <div><div style="font-weight:700;font-size:13.5px;">${T.mapLink}</div>
        <div style="font-size:12px;color:var(--concrete);margin-top:2px;">${T.mapLinkSub}</div></div>
        <span style="color:var(--orange);font-size:20px;">→</span></div></a>`;
    }catch(e){
      storeResults.innerHTML=`<div class="err-box">${T.aiErr(e.message)}</div>`;
    }
    locateBtn.disabled=false; locateBtn.textContent=T.refreshArea;
  },()=>{noLoc(); locateBtn.disabled=false; locateBtn.textContent=T.locateBtn;},{timeout:10000});
});
function noLoc(){
  storeResults.innerHTML=`<div class="err-box">${T.noLoc} <a href="https://www.google.com/maps/search/builders+merchant" target="_blank" style="color:var(--orange);">${T.openMaps}</a></div>`;
}

applyLanguage();
</script>
